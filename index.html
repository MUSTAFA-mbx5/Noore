<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>بوك الثروة الوطنية 💸🛢️</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            font-family: 'Cairo', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            background: #111;
            overflow: hidden;
        }

        /* شاشة اللعبة كاملة العرض والطول */
        #game-container {
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #0f2027, #203a43, #2c5364);
            position: relative;
            overflow: hidden;
        }

        /* الخلفية المتحركة (خطوط السرعة) */
        .speed-lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 200%;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 50px,
                rgba(255, 255, 255, 0.03) 50px,
                rgba(255, 255, 255, 0.03) 100px
            );
            animation: moveLines 1s linear infinite;
            z-index: 1;
        }

        @keyframes moveLines {
            0% { transform: translateY(0); }
            100% { transform: translateY(100px); }
        }

        /* الأرضية */
        .ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 70px;
            background: #1a1a1a;
            border-top: 6px solid #f1c40f;
            z-index: 2;
            box-shadow: 0 -10px 30px rgba(241, 196, 15, 0.2);
        }

        /* الشخصية (كبرنا حجمها شوية للشاشات الكبيرة) */
        #player {
            width: 140px;
            height: 170px;
            background-image: url('character.png'); /* تأكد من اسم الصورة */
            background-size: contain;
            background-position: center bottom;
            background-repeat: no-repeat;
            position: absolute;
            bottom: 55px;
            left: calc(50% - 70px);
            z-index: 10;
            filter: drop-shadow(0 15px 15px rgba(0,0,0,0.8));
            animation: idleFloat 1.2s infinite alternate ease-in-out;
        }

        @keyframes idleFloat {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-8px) scale(1.02); }
        }

        /* الأغراض المتساقطة (كبرنا حجمها شوية) */
        .falling-item {
            position: absolute;
            width: 75px;
            height: 75px;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            top: -100px;
            z-index: 5;
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.7));
        }

        /* واجهة المستخدم (النقاط والقلوب) */
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
            pointer-events: none;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 32px;
            font-weight: 900;
            color: #fff;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        #score-board { color: #f1c40f; }
        #lives { letter-spacing: 5px; font-size: 28px; }

        /* النصوص الطائرة */
        .floating-text {
            position: absolute;
            font-size: 45px;
            font-weight: 900;
            z-index: 15;
            pointer-events: none;
            animation: floatUp 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            text-shadow: 3px 3px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-120px) scale(1.5); opacity: 0; }
        }

        /* شاشات البداية والنهاية */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 30;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .screen h1 {
            font-size: 55px;
            margin-bottom: 10px;
            color: #f1c40f;
            text-shadow: 5px 5px 0 #e74c3c, 0 0 20px rgba(241, 196, 15, 0.5);
        }

        .screen p {
            font-size: 26px;
            color: #ecf0f1;
            margin-bottom: 40px;
            line-height: 1.6;
            font-weight: bold;
        }

        button {
            padding: 20px 60px;
            font-size: 32px;
            font-family: 'Cairo', sans-serif;
            font-weight: 900;
            cursor: pointer;
            background: linear-gradient(to bottom, #2ecc71, #27ae60);
            color: white;
            border: none;
            border-radius: 50px;
            box-shadow: 0 10px 0 #1e8449, 0 20px 30px rgba(0,0,0,0.6);
            transition: all 0.1s;
        }

        button:active {
            transform: translateY(10px);
            box-shadow: 0 0 0 #1e8449, 0 5px 10px rgba(0,0,0,0.6);
        }

        .hidden { display: none !important; }

        /* أزرار التحكم للجوال (تتوزع على أطراف الشاشة) */
        .mobile-controls {
            position: absolute;
            bottom: 30px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 5%; /* مسافة من الأطراف */
            z-index: 25;
            pointer-events: none;
        }
        .mobile-controls button {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            font-size: 45px;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            background: rgba(255,255,255,0.2);
            box-shadow: none;
            border: 2px solid rgba(255,255,255,0.5);
            color: white;
            opacity: 0.8;
            backdrop-filter: blur(5px);
        }
        .mobile-controls button:active {
            background: rgba(255,255,255,0.6);
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <audio id="bg-music" loop>
        <source src="dOZNqq7b2h4.m4a" type="audio/mp4">
    </audio>

    <div id="game-container">
        <div class="speed-lines"></div>
        <div class="ground"></div>
        
        <div id="ui-layer">
            <div id="score-board" class="glass-panel">💰 0</div>
            <div id="lives" class="glass-panel">❤️❤️❤️</div>
        </div>

        <div id="player"></div>

        <!-- أزرار للجوال -->
        <div class="mobile-controls">
            <button onclick="movePlayer(-50)">⬅️</button>
            <button onclick="movePlayer(50)">➡️</button>
        </div>

        <!-- النصوص العربية الخاصة بك -->
        <div id="start-screen" class="screen">
            <h1>بوك الثروة الوطنية 💸🛢️</h1>
            <p>ساعد الشخصية بوك الفلوس العراق!<br>احذر من عاليه نصيف 💣!</p>
            <button onclick="startGame()">ابدأ شغلها</button>
        </div>

        <div id="game-over-screen" class="screen hidden">
            <h1>خلصت مو خوش حرامي! 😂</h1>
            <p>النقاط النهائية: <span id="final-score" style="color:#f1c40f; font-size: 55px;">0</span></p>
            <button onclick="restartGame()">العب مرة ثانية</button>
        </div>
    </div>

    <script>
        // --- الإعدادات ---
        const PLAYER_WIDTH = 140;
        const PLAYER_HEIGHT = 170;
        const ITEM_WIDTH = 75;
        const ITEM_HEIGHT = 75;

        const player = document.getElementById('player');
        const gameContainer = document.getElementById('game-container');
        const scoreBoard = document.getElementById('score-board');
        const livesBoard = document.getElementById('lives');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScoreEl = document.getElementById('final-score');
        const music = document.getElementById('bg-music');

        let playerX = 0;
        let score = 0;
        let lives = 3;
        let isGameRunning = false;
        let spawnInterval;
        
        // 🟢 تم تبطئة السرعة هنا (من 22 إلى 6)
        let gameSpeed = 6; 
        
        let animationId;
        let items = [];

        // --- أنواع الأغراض ---
        const itemTypes = [
            { image: 'money.png', points: 10, type: 'money' },
            { image: 'oil.png',   points: 20, type: 'oil' },
            { image: 'bomb.png',  points: -1, type: 'bomb' }
        ];

        // --- التحكم ---
        document.addEventListener('keydown', (e) => {
            if (!isGameRunning) return;
            if (e.key === 'ArrowLeft' || e.key === 'a') movePlayer(-50);
            if (e.key === 'ArrowRight' || e.key === 'd') movePlayer(50);
        });

        gameContainer.addEventListener('touchmove', (e) => {
            if (!isGameRunning) return;
            e.preventDefault();
            const rect = gameContainer.getBoundingClientRect();
            const touchX = e.touches[0].clientX - rect.left;
            playerX = touchX - PLAYER_WIDTH / 2;
            constrainPlayer();
            player.style.left = playerX + 'px';
        }, { passive: false });

        gameContainer.addEventListener('mousemove', (e) => {
            if (!isGameRunning || e.buttons !== 1) return;
            const rect = gameContainer.getBoundingClientRect();
            playerX = e.clientX - rect.left - PLAYER_WIDTH / 2;
            constrainPlayer();
            player.style.left = playerX + 'px';
        });

        function movePlayer(amount) {
            if (!isGameRunning) return;
            playerX += amount;
            constrainPlayer();
            player.style.left = playerX + 'px';
        }

        function constrainPlayer() {
            const maxRight = gameContainer.clientWidth - PLAYER_WIDTH;
            if (playerX < 0) playerX = 0;
            if (playerX > maxRight) playerX = maxRight;
        }

        // --- بدء اللعبة ---
        function startGame() {
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            
            score = 0;
            lives = 3;
            playerX = gameContainer.clientWidth / 2 - PLAYER_WIDTH / 2;
            player.style.left = playerX + 'px';
            scoreBoard.innerText = '💰 0';
            livesBoard.innerText = '❤️❤️❤️';
            
            gameSpeed = 6; // إعادة ضبط السرعة للبداية (بطيئة ومناسبة)
            items.forEach(i => i.element.remove());
            items = [];
            
            isGameRunning = true;

            music.volume = 0.5;
            music.play().catch(e => console.log("Audio blocked"));

            // 🟢 الأغراض تطلع كل 800 ملي ثانية (سرعة طبيعية)
            spawnInterval = setInterval(spawnItem, 800);
            gameLoop();
        }

        function restartGame() {
            startGame();
        }

        // --- إنشاء الأغراض ---
        function spawnItem() {
            if (!isGameRunning) return;

            const randomType = itemTypes[Math.floor(Math.random() * itemTypes.length)];
            
            const itemEl = document.createElement('div');
            itemEl.classList.add('falling-item');
            itemEl.style.backgroundImage = `url('${randomType.image}')`;
            
            const randomX = Math.floor(Math.random() * (gameContainer.clientWidth - ITEM_WIDTH));
            itemEl.style.left = randomX + 'px';
            
            gameContainer.appendChild(itemEl);

            items.push({
                element: itemEl,
                x: randomX,
                y: -100,
                // سرعة عشوائية بسيطة جداً
                speed: gameSpeed + Math.random() * 2, 
                type: randomType
            });
        }

        // --- حلقة اللعب ---
        function gameLoop() {
            if (!isGameRunning) return;

            const playerRect = player.getBoundingClientRect();
            const containerRect = gameContainer.getBoundingClientRect();
            const playerTop = playerRect.top - containerRect.top;
            const playerBottom = playerRect.bottom - containerRect.top;

            for (let i = items.length - 1; i >= 0; i--) {
                let item = items[i];
                item.y += item.speed;
                item.element.style.top = item.y + 'px';

                // فحص الاصطدام
                if (item.y + ITEM_HEIGHT > playerTop && item.y < playerBottom) {
                    if (item.x + ITEM_WIDTH - 20 > playerX && item.x + 20 < playerX + PLAYER_WIDTH) {
                        handleCatch(item);
                        items.splice(i, 1);
                        continue;
                    }
                }

                // طاح على الأرض
                if (item.y > gameContainer.clientHeight - 70) {
                    if (item.type.type !== 'bomb') {
                        loseLife();
                    }
                    item.element.remove();
                    items.splice(i, 1);
                }
            }

            animationId = requestAnimationFrame(gameLoop);
        }

        // --- معالجة الجمع ---
        function handleCatch(item) {
            if (item.type.type === 'bomb') {
                item.element.style.transform = 'scale(3)';
                item.element.style.opacity = '0';
                item.element.style.transition = 'all 0.3s';
                setTimeout(() => item.element.remove(), 300);
                loseLife();
                showFloatingText('-1 ❤️', item.x, item.y, '#e74c3c');
            } else {
                score += item.type.points;
                scoreBoard.innerText = `💰 ${score}`;
                showFloatingText(`+${item.type.points}`, item.x, item.y, '#2ecc71');
                
                item.element.style.transform = 'scale(2) translateY(-50px)';
                item.element.style.opacity = '0';
                item.element.style.transition = 'all 0.3s';
                setTimeout(() => item.element.remove(), 300);

                // 🟢 زيادة السرعة تكون بطيئة جداً (كل 100 نقطة تزيد 1 فقط، وتوقف عند 18)
                if (score % 100 === 0 && gameSpeed < 18) {
                    gameSpeed += 1; 
                }
            }
        }

        function loseLife() {
            lives--;
            livesBoard.innerText = '❤️'.repeat(Math.max(0, lives)) + '🖤'.repeat(3 - Math.max(0, lives));
            
            gameContainer.style.transform = 'translateX(15px)';
            setTimeout(() => gameContainer.style.transform = 'translateX(-15px)', 50);
            setTimeout(() => gameContainer.style.transform = 'translateX(0)', 100);

            if (lives <= 0) gameOver();
        }

        function showFloatingText(text, x, y, color) {
            const el = document.createElement('div');
            el.classList.add('floating-text');
            el.innerText = text;
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            el.style.color = color;
            gameContainer.appendChild(el);
            setTimeout(() => el.remove(), 800);
        }

        function gameOver() {
            isGameRunning = false;
            clearInterval(spawnInterval);
            cancelAnimationFrame(animationId);
            music.pause();
            
            finalScoreEl.innerText = score;
            gameOverScreen.classList.remove('hidden');
        }
    </script>
</body>
</html>
