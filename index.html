<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لعبة الثروة الوطنية 💸🛢️</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            font-family: 'Cairo', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #1e130c, #9a8478);
            overflow: hidden;
        }

        #game-container {
            width: 100%;
            max-width: 450px;
            height: 100%;
            max-height: 700px;
            background: linear-gradient(to bottom, #2c3e50, #4ca1af);
            position: relative;
            overflow: hidden;
            border: 8px solid #111;
            border-radius: 20px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.8), inset 0 0 20px rgba(0,0,0,0.5);
        }

        /* أرضية اللعبة */
        .ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 60px;
            background: #8b5a2b;
            border-top: 5px solid #a0522d;
            z-index: 1;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.5);
        }

        /* الشخصية */
        #player {
            width: 90px;
            height: 90px;
            background-image: url('maliki.jpg');
            background-size: cover;
            background-position: center;
            position: absolute;
            bottom: 40px;
            left: calc(50% - 45px);
            border-radius: 50%;
            border: 4px solid #fff;
            z-index: 10;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            animation: bounce 0.6s infinite alternate ease-in-out;
        }

        /* تأثير النط والاهتزاز للشخصية */
        @keyframes bounce {
            from { transform: translateY(0) scale(1); }
            to { transform: translateY(-10px) scale(1.02); }
        }

        /* الأغراض اللي تطيح */
        .falling-item {
            position: absolute;
            font-size: 45px;
            top: -60px;
            z-index: 5;
            filter: drop-shadow(0 5px 5px rgba(0,0,0,0.5));
        }

        /* لوحة النقاط */
        #ui-layer {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
        }

        #score-board {
            background: rgba(0, 0, 0, 0.7);
            color: #f1c40f;
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 22px;
            font-weight: 900;
            border: 2px solid #f1c40f;
            box-shadow: 0 0 10px rgba(241, 196, 15, 0.5);
        }

        #lives {
            font-size: 25px;
            letter-spacing: 5px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
        }

        /* نصوص طائرة (مثل +10) */
        .floating-text {
            position: absolute;
            color: #2ecc71;
            font-size: 30px;
            font-weight: 900;
            z-index: 15;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            text-shadow: 2px 2px 0 #000;
        }

        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-80px); opacity: 0; }
        }

        /* شاشات البداية والنهاية */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 30;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .screen h1 {
            font-size: 35px;
            margin-bottom: 10px;
            color: #f1c40f;
            text-shadow: 3px 3px 0 #e74c3c;
        }

        .screen p {
            font-size: 18px;
            color: #bdc3c7;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        button {
            padding: 15px 40px;
            font-size: 24px;
            font-family: 'Cairo', sans-serif;
            font-weight: 900;
            cursor: pointer;
            background: linear-gradient(to bottom, #2ecc71, #27ae60);
            color: white;
            border: none;
            border-radius: 50px;
            box-shadow: 0 8px 0 #1e8449, 0 15px 20px rgba(0,0,0,0.5);
            transition: all 0.1s;
        }

        button:active {
            transform: translateY(8px);
            box-shadow: 0 0 0 #1e8449, 0 5px 10px rgba(0,0,0,0.5);
        }

        .hidden {
            display: none !important;
        }

        /* تعليمات الجوال */
        .controls-hint {
            position: absolute;
            bottom: 15px;
            width: 100%;
            text-align: center;
            color: rgba(255,255,255,0.5);
            font-size: 14px;
            z-index: 2;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- الأغنية -->
    <audio id="bg-music" loop>
        <source src="dOZNqq7b2h4.m4a" type="audio/mp4">
    </audio>

    <div id="game-container">
        <div class="ground"></div>
        
        <div id="ui-layer">
            <div id="score-board">💰 0</div>
            <div id="lives">❤️❤️❤️</div>
        </div>

        <div id="player"></div>

        <div class="controls-hint">حرك بإصبعك أو بالأسهم ⬅️➡️</div>

        <!-- شاشة البداية -->
        <div id="start-screen" class="screen">
            <h1>الثروة الوطنية 💸🛢️</h1>
            <p>ساعد الوزير بجمع الدولارات والنفط!<br>احذر من القنابل 💣!</p>
            <button onclick="startGame()">ابدأ اللعبة</button>
        </div>

        <!-- شاشة النهاية -->
        <div id="game-over-screen" class="screen hidden">
            <h1>خلصت الثروة! 😂</h1>
            <p>النقاط النهائية: <span id="final-score" style="color:#f1c40f; font-size: 30px;">0</span></p>
            <button onclick="restartGame()">العب مرة ثانية</button>
        </div>
    </div>

    <script>
        // --- المتغيرات الأساسية ---
        const player = document.getElementById('player');
        const gameContainer = document.getElementById('game-container');
        const scoreBoard = document.getElementById('score-board');
        const livesBoard = document.getElementById('lives');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScoreEl = document.getElementById('final-score');
        const music = document.getElementById('bg-music');

        let playerX = gameContainer.clientWidth / 2 - 45;
        let score = 0;
        let lives = 3;
        let isGameRunning = false;
        let spawnInterval;
        let gameSpeed = 6;
        let animationId;

        // مصفوفة الأغراض المتساقطة
        let items = [];

        // الأنواع: دولار، نفط، قنبلة
        const itemTypes = [
            { emoji: '💵', points: 10, type: 'money' },
            { emoji: '🛢️', points: 20, type: 'oil' },
            { emoji: '💣', points: -1, type: 'bomb' }
        ];

        // --- التحكم بالشخصية ---
        // 1. الكيبورد
        document.addEventListener('keydown', (e) => {
            if (!isGameRunning) return;
            if (e.key === 'ArrowLeft' || e.key === 'a') movePlayer(-30);
            if (e.key === 'ArrowRight' || e.key === 'd') movePlayer(30);
        });

        // 2. اللمس أو الماوس (للجوال)
        gameContainer.addEventListener('touchmove', (e) => {
            if (!isGameRunning) return;
            const rect = gameContainer.getBoundingClientRect();
            const touchX = e.touches[0].clientX - rect.left;
            playerX = touchX - 45; // 45 هو نصف عرض الشخصية
            constrainPlayer();
            player.style.left = playerX + 'px';
        });

        gameContainer.addEventListener('mousemove', (e) => {
            if (!isGameRunning || e.buttons !== 1) return; // فقط إذا كان الزر مضغوط
            const rect = gameContainer.getBoundingClientRect();
            playerX = e.clientX - rect.left - 45;
            constrainPlayer();
            player.style.left = playerX + 'px';
        });

        function movePlayer(amount) {
            playerX += amount;
            constrainPlayer();
            player.style.left = playerX + 'px';
        }

        function constrainPlayer() {
            const maxRight = gameContainer.clientWidth - 90;
            if (playerX < 0) playerX = 0;
            if (playerX > maxRight) playerX = maxRight;
        }

        // --- إدارة اللعبة ---
        function startGame() {
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            
            // تصفير الإحصائيات
            score = 0;
            lives = 3;
            playerX = gameContainer.clientWidth / 2 - 45;
            player.style.left = playerX + 'px';
            scoreBoard.innerText = '💰 0';
            livesBoard.innerText = '❤️❤️❤️';
            gameSpeed = 7;
            items.forEach(i => i.element.remove());
            items = [];
            
            isGameRunning = true;

            // تشغيل الصوت
            music.volume = 0.5;
            music.play().catch(e => console.log("Audio play blocked"));

            // بدء اللعبة
            spawnInterval = setInterval(spawnItem, 800);
            gameLoop();
        }

        function restartGame() {
            startGame();
        }

        // --- إنشاء الأغراض ---
        function spawnItem() {
            if (!isGameRunning) return;

            const randomType = itemTypes[Math.floor(Math.random() * itemTypes.length)];
            
            const itemEl = document.createElement('div');
            itemEl.classList.add('falling-item');
            itemEl.innerText = randomType.emoji;
            
            // موقع عشوائي
            const randomX = Math.floor(Math.random() * (gameContainer.clientWidth - 50));
            itemEl.style.left = randomX + 'px';
            
            gameContainer.appendChild(itemEl);

            items.push({
                element: itemEl,
                x: randomX,
                y: -60,
                speed: gameSpeed + Math.random() * 3, // سرعة عشوائية
                type: randomType
            });
        }

        // --- حلقة اللعب (Game Loop) ---
        function gameLoop() {
            if (!isGameRunning) return;

            const playerRect = player.getBoundingClientRect();
            const containerRect = gameContainer.getBoundingClientRect();

            for (let i = items.length - 1; i >= 0; i--) {
                let item = items[i];
                item.y += item.speed;
                item.element.style.top = item.y + 'px';

                // فحص الاصطدام
                const itemRect = item.element.getBoundingClientRect();
                
                // إذا كان الغرض في مستوى الشخصية
                if (item.y > playerRect.top - containerRect.top - 40 && item.y < playerRect.bottom - containerRect.top) {
                    // فحص التقاطع الأفقي
                    if (item.x + 40 > playerX && item.x < playerX + 90) {
                        handleCatch(item);
                        items.splice(i, 1); // إزالة الغرض
                        continue;
                    }
                }

                // إذا طاح على الأرض
                if (item.y > gameContainer.clientHeight - 50) {
                    if (item.type.type !== 'bomb') {
                        // خسران حياة إذا ضاع الدولار أو النفط
                        loseLife();
                    }
                    item.element.remove();
                    items.splice(i, 1);
                }
            }

            animationId = requestAnimationFrame(gameLoop);
        }

        // --- معالجة الجمع ---
        function handleCatch(item) {
            const itemRect = item.element.getBoundingClientRect();
            const containerRect = gameContainer.getBoundingClientRect();
            
            if (item.type.type === 'bomb') {
                // جمع قنبلة
                item.element.innerText = '💥';
                setTimeout(() => item.element.remove(), 200);
                loseLife();
                showFloatingText('-1 ❤️', item.x, item.y, '#e74c3c');
            } else {
                // جمع فلوس أو نفط
                score += item.type.points;
                scoreBoard.innerText = `💰 ${score}`;
                showFloatingText(`+${item.type.points}`, item.x, item.y, '#2ecc71');
                
                // تأثير اختفاء
                item.element.style.transform = 'scale(2)';
                item.element.style.opacity = '0';
                setTimeout(() => item.element.remove(), 200);

                // زيادة السرعة كل 100 نقطة
                if (score % 100 === 0 && gameSpeed < 15) {
                    gameSpeed += 1;
                }
            }
        }

        // --- خسارة حياة ---
        function loseLife() {
            lives--;
            livesBoard.innerText = '❤️'.repeat(Math.max(0, lives)) + '🖤'.repeat(3 - Math.max(0, lives));
            
            // اهتزاز الشاشة
            gameContainer.style.transform = 'translateX(10px)';
            setTimeout(() => gameContainer.style.transform = 'translateX(-10px)', 50);
            setTimeout(() => gameContainer.style.transform = 'translateX(0)', 100);

            if (lives <= 0) {
                gameOver();
            }
        }

        // --- نص طائر ---
        function showFloatingText(text, x, y, color) {
            const el = document.createElement('div');
            el.classList.add('floating-text');
            el.innerText = text;
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            el.style.color = color;
            gameContainer.appendChild(el);
            setTimeout(() => el.remove(), 800);
        }

        // --- نهاية اللعبة ---
        function gameOver() {
            isGameRunning = false;
            clearInterval(spawnInterval);
            cancelAnimationFrame(animationId);
            music.pause();
            
            finalScoreEl.innerText = score;
            gameOverScreen.classList.remove('hidden');
        }
    </script>
</body>
</html>
