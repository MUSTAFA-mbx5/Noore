<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لعبة جمع الدولار والنفط</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #222;
            font-family: Arial, sans-serif;
            flex-direction: column;
        }

        #game-container {
            width: 400px;
            height: 600px;
            background-color: #87CEEB; /* لون سماوي */
            position: relative;
            overflow: hidden;
            border: 4px solid #fff;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        #player {
            width: 80px;
            height: 80px;
            background-image: url('maliki.jpg'); /* هنا اسم الصورة */
            background-size: cover;
            background-position: center;
            position: absolute;
            bottom: 10px;
            left: 160px; /* بالمنتصف */
            border-radius: 50%;
            border: 3px solid #fff;
            z-index: 10;
        }

        .falling-item {
            position: absolute;
            width: 40px;
            height: 40px;
            font-size: 30px;
            text-align: center;
            line-height: 40px;
            top: -50px;
        }

        #score-board {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: rgba(0,0,0,0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 20px;
            font-weight: bold;
        }

        #controls {
            margin-top: 20px;
            color: white;
            text-align: center;
        }
        
        button {
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- الأغنية (تشتغل تلقائياً) -->
    <audio id="bg-music" loop>
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <div id="game-container">
        <div id="score-board">النقاط: 0</div>
        <div id="player"></div>
    </div>

    <div id="controls">
        <p>استخدم أسهم الكيبورد (يمين ويسار) للحركة</p>
        <button onclick="startGame()">ابدأ اللعبة وشغل الأغنية</button>
    </div>

    <script>
        const player = document.getElementById('player');
        const gameContainer = document.getElementById('game-container');
        const scoreBoard = document.getElementById('score-board');
        const music = document.getElementById('bg-music');
        
        let playerX = 160; // موقع الشخصية الابتدائي
        let score = 0;
        let gameInterval;
        let isGameOver = false;

        // تحريك الشخصية بالكيبورد
        document.addEventListener('keydown', (e) => {
            if (isGameOver) return;
            
            if (e.key === 'ArrowLeft' && playerX > 0) {
                playerX -= 20;
            } else if (e.key === 'ArrowRight' && playerX < 320) {
                playerX += 20;
            }
            player.style.left = playerX + 'px';
        });

        // تشغيل اللعبة والأغنية
        function startGame() {
            if (isGameOver || gameInterval) return;
            
            // تشغيل الصوت (بعض المتصفحات تمنع التشغيل التلقائي بدون ضغطة زر، فحطينا الزر)
            music.volume = 0.5;
            music.play().catch(e => console.log("المتصفح منع تشغيل الأغنية"));
            
            // كل 800 ميلي ثانية تنزل غرض جديد
            gameInterval = setInterval(createItem, 800); 
        }

        // دالة إنشاء الأغراض (دولار ونفط)
        function createItem() {
            if (isGameOver) return;

            const item = document.createElement('div');
            item.classList.add('falling-item');
            
            // اختيار عشوائي بين دولار ونفط
            const isDollar = Math.random() > 0.5;
            item.innerText = isDollar ? '💵' : '🛢️'; 
            
            // موقع عشوائي للطيح
            const randomLeft = Math.floor(Math.random() * 360);
            item.style.left = randomLeft + 'px';

            gameContainer.appendChild(item);

            let itemTop = -50;
            
            // حركة الطيحان
            const fallInterval = setInterval(() => {
                if (isGameOver) {
                    clearInterval(fallInterval);
                    return;
                }

                itemTop += 5; // سرعة الطيحان
                item.style.top = itemTop + 'px';

                // فحص الاصطدام (إذا وصل الغرض لتحت)
                if (itemTop > 500) { 
                    // إذا كان الغرض قريب من موقع الشخصية (x)
                    if (randomLeft > playerX - 40 && randomLeft < playerX + 80) {
                        // جمع الغرض
                        score += 10;
                        scoreBoard.innerText = 'النقاط: ' + score;
                        item.remove();
                        clearInterval(fallInterval);
                    } 
                    // إذا طاح على الأرض بدون ما نجمعه
                    else if (itemTop > 600) {
                        item.remove();
                        clearInterval(fallInterval);
                    }
                }
            }, 20);
        }
    </script>
</body>
</html>
