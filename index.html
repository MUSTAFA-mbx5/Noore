<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نوري المالكي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            font-family: 'Cairo', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #1e130c, #9a8478);
            overflow: hidden;
        }

        #game-container {
            width: 100%;
            max-width: 450px;
            height: 100%;
            max-height: 700px;
            background: linear-gradient(to bottom, #2c3e50, #4ca1af);
            position: relative;
            overflow: hidden;
            border: 8px solid #111;
            border-radius: 20px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.8), inset 0 0 20px rgba(0,0,0,0.5);
        }

        .ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 60px;
            background: #8b5a2b;
            border-top: 5px solid #a0522d;
            z-index: 1;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.5);
        }

        /* الشخصية - صورة كاملة بدل الدائرة */
        #player {
            width: 100px;
            height: 130px;
            background-image: url('character.png');
            background-size: contain;
            background-position: center bottom;
            background-repeat: no-repeat;
            position: absolute;
            bottom: 40px;
            left: calc(50% - 50px);
            z-index: 10;
            filter: drop-shadow(0 8px 12px rgba(0,0,0,0.7));
            animation: bounce 0.6s infinite alternate ease-in-out;
            /* لم نعد نستخدم border-radius لأنها صورة PNG شفافة */
        }

        @keyframes bounce {
            from { transform: translateY(0) scale(1); }
            to { transform: translateY(-10px) scale(1.02); }
        }

        /* الأغراض المتساقطة (صور) */
        .falling-item {
            position: absolute;
            width: 55px;
            height: 55px;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            top: -60px;
            z-index: 5;
            filter: drop-shadow(0 5px 8px rgba(0,0,0,0.6));
        }

        #ui-layer {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
        }

        #score-board {
            background: rgba(0, 0, 0, 0.7);
            color: #f1c40f;
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 22px;
            font-weight: 900;
            border: 2px solid #f1c40f;
            box-shadow: 0 0 10px rgba(241, 196, 15, 0.5);
        }

        #lives {
            font-size: 25px;
            letter-spacing: 5px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
        }

        .floating-text {
            position: absolute;
            color: #2ecc71;
            font-size: 30px;
            font-weight: 900;
            z-index: 15;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            text-shadow: 2px 2px 0 #000;
        }

        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-80px); opacity: 0; }
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 30;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .screen h1 {
            font-size: 35px;
            margin-bottom: 10px;
            color: #f1c40f;
            text-shadow: 3px 3px 0 #e74c3c;
        }

        .screen p {
            font-size: 18px;
            color: #bdc3c7;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        button {
            padding: 15px 40px;
            font-size: 24px;
            font-family: 'Cairo', sans-serif;
            font-weight: 900;
            cursor: pointer;
            background: linear-gradient(to bottom, #2ecc71, #27ae60);
            color: white;
            border: none;
            border-radius: 50px;
            box-shadow: 0 8px 0 #1e8449, 0 15px 20px rgba(0,0,0,0.5);
            transition: all 0.1s;
        }

        button:active {
            transform: translateY(8px);
            box-shadow: 0 0 0 #1e8449, 0 5px 10px rgba(0,0,0,0.5);
        }

        .hidden {
            display: none !important;
        }

        .controls-hint {
            position: absolute;
            bottom: 15px;
            width: 100%;
            text-align: center;
            color: rgba(255,255,255,0.5);
            font-size: 14px;
            z-index: 2;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <audio id="bg-music" loop>
        <source src="dOZNqq7b2h4.m4a" type="audio/mp4">
    </audio>

    <div id="game-container">
        <div class="ground"></div>
        
        <div id="ui-layer">
            <div id="score-board">💰 0</div>
            <div id="lives">❤️❤️❤️</div>
        </div>

        <div id="player"></div>

        <div class="controls-hint">حرك بإصبعك أو بالأسهم ⬅️➡️</div>

        <div id="start-screen" class="screen">
            <h1>بوك الثروة الوطنية  💸🛢️</h1>
            <p>ساعد الشخصية بجمع الفلوس والنفط!<br>احذر من حنان فتلاوي 💣!</p>
            <button onclick="startGame()">ابدأ شغلها</button>
        </div>

        <div id="game-over-screen" class="screen hidden">
            <h1>خلصت مو خوش حرامي! 😂</h1>
            <p>النقاط النهائية: <span id="final-score" style="color:#f1c40f; font-size: 30px;">0</span></p>
            <button onclick="restartGame()">العب مرة ثانية</button>
        </div>
    </div>

    <script>
        // --- الإعدادات ---
        const PLAYER_WIDTH = 100;
        const PLAYER_HEIGHT = 130;
        const ITEM_WIDTH = 55;
        const ITEM_HEIGHT = 55;

        const player = document.getElementById('player');
        const gameContainer = document.getElementById('game-container');
        const scoreBoard = document.getElementById('score-board');
        const livesBoard = document.getElementById('lives');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScoreEl = document.getElementById('final-score');
        const music = document.getElementById('bg-music');

        let playerX = 0;
        let score = 0;
        let lives = 3;
        let isGameRunning = false;
        let spawnInterval;
        let gameSpeed = 6;
        let animationId;
        let items = [];

        // --- أنواع الأغراض (صورك) ---
        const itemTypes = [
            { image: 'money.png', points: 10, type: 'money' },
            { image: 'oil.png',   points: 20, type: 'oil' },
            { image: 'bomb.png',  points: -1, type: 'bomb' }
        ];

        // --- التحكم ---
        document.addEventListener('keydown', (e) => {
            if (!isGameRunning) return;
            if (e.key === 'ArrowLeft' || e.key === 'a') movePlayer(-30);
            if (e.key === 'ArrowRight' || e.key === 'd') movePlayer(30);
        });

        gameContainer.addEventListener('touchmove', (e) => {
            if (!isGameRunning) return;
            e.preventDefault();
            const rect = gameContainer.getBoundingClientRect();
            const touchX = e.touches[0].clientX - rect.left;
            playerX = touchX - PLAYER_WIDTH / 2;
            constrainPlayer();
            player.style.left = playerX + 'px';
        }, { passive: false });

        gameContainer.addEventListener('mousemove', (e) => {
            if (!isGameRunning || e.buttons !== 1) return;
            const rect = gameContainer.getBoundingClientRect();
            playerX = e.clientX - rect.left - PLAYER_WIDTH / 2;
            constrainPlayer();
            player.style.left = playerX + 'px';
        });

        function movePlayer(amount) {
            playerX += amount;
            constrainPlayer();
            player.style.left = playerX + 'px';
        }

        function constrainPlayer() {
            const maxRight = gameContainer.clientWidth - PLAYER_WIDTH;
            if (playerX < 0) playerX = 0;
            if (playerX > maxRight) playerX = maxRight;
        }

        // --- بدء اللعبة ---
        function startGame() {
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            
            score = 0;
            lives = 3;
            playerX = gameContainer.clientWidth / 2 - PLAYER_WIDTH / 2;
            player.style.left = playerX + 'px';
            scoreBoard.innerText = '💰 0';
            livesBoard.innerText = '❤️❤️❤️';
            gameSpeed = 7;
            items.forEach(i => i.element.remove());
            items = [];
            
            isGameRunning = true;

            music.volume = 0.5;
            music.play().catch(e => console.log("Audio blocked"));

            spawnInterval = setInterval(spawnItem, 800);
            gameLoop();
        }

        function restartGame() {
            startGame();
        }

        // --- إنشاء الأغراض (بالصور) ---
        function spawnItem() {
            if (!isGameRunning) return;

            const randomType = itemTypes[Math.floor(Math.random() * itemTypes.length)];
            
            const itemEl = document.createElement('div');
            itemEl.classList.add('falling-item');
            itemEl.style.backgroundImage = `url('${randomType.image}')`;
            
            const randomX = Math.floor(Math.random() * (gameContainer.clientWidth - ITEM_WIDTH));
            itemEl.style.left = randomX + 'px';
            
            gameContainer.appendChild(itemEl);

            items.push({
                element: itemEl,
                x: randomX,
                y: -60,
                speed: gameSpeed + Math.random() * 3,
                type: randomType
            });
        }

        // --- حلقة اللعب ---
        function gameLoop() {
            if (!isGameRunning) return;

            const playerRect = player.getBoundingClientRect();
            const containerRect = gameContainer.getBoundingClientRect();
            const playerTop = playerRect.top - containerRect.top;
            const playerBottom = playerRect.bottom - containerRect.top;

            for (let i = items.length - 1; i >= 0; i--) {
                let item = items[i];
                item.y += item.speed;
                item.element.style.top = item.y + 'px';

                // فحص الاصطدام
                if (item.y + ITEM_HEIGHT > playerTop && item.y < playerBottom) {
                    if (item.x + ITEM_WIDTH > playerX && item.x < playerX + PLAYER_WIDTH) {
                        handleCatch(item);
                        items.splice(i, 1);
                        continue;
                    }
                }

                // طاح على الأرض
                if (item.y > gameContainer.clientHeight - 55) {
                    if (item.type.type !== 'bomb') {
                        loseLife();
                    }
                    item.element.remove();
                    items.splice(i, 1);
                }
            }

            animationId = requestAnimationFrame(gameLoop);
        }

        // --- معالجة الجمع ---
        function handleCatch(item) {
            if (item.type.type === 'bomb') {
                // تأثير انفجار
                item.element.style.transform = 'scale(2.5)';
                item.element.style.opacity = '0';
                item.element.style.transition = 'all 0.3s';
                setTimeout(() => item.element.remove(), 300);
                loseLife();
                showFloatingText('-1 ❤️', item.x, item.y, '#e74c3c');
            } else {
                score += item.type.points;
                scoreBoard.innerText = `💰 ${score}`;
                showFloatingText(`+${item.type.points}`, item.x, item.y, '#2ecc71');
                
                item.element.style.transform = 'scale(1.8) translateY(-30px)';
                item.element.style.opacity = '0';
                item.element.style.transition = 'all 0.3s';
                setTimeout(() => item.element.remove(), 300);

                if (score % 100 === 0 && gameSpeed < 15) {
                    gameSpeed += 1;
                }
            }
        }

        function loseLife() {
            lives--;
            livesBoard.innerText = '❤️'.repeat(Math.max(0, lives)) + '🖤'.repeat(3 - Math.max(0, lives));
            
            gameContainer.style.transform = 'translateX(10px)';
            setTimeout(() => gameContainer.style.transform = 'translateX(-10px)', 50);
            setTimeout(() => gameContainer.style.transform = 'translateX(0)', 100);

            if (lives <= 0) gameOver();
        }

        function showFloatingText(text, x, y, color) {
            const el = document.createElement('div');
            el.classList.add('floating-text');
            el.innerText = text;
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            el.style.color = color;
            gameContainer.appendChild(el);
            setTimeout(() => el.remove(), 800);
        }

        function gameOver() {
            isGameRunning = false;
            clearInterval(spawnInterval);
            cancelAnimationFrame(animationId);
            music.pause();
            
            finalScoreEl.innerText = score;
            gameOverScreen.classList.remove('hidden');
        }
    </script>
</body>
</html>
